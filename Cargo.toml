[package]
name = "circom-witness-rs"
description = "Fast witness generator for Circom circuits"
version = "0.2.3"
edition = "2021"
license = "MIT"
keywords = ["cryptography", "ZK", "circom"]
categories = ["cryptography"]
repository = "https://github.com/philsippl/circom-witness-rs"
authors = [
  "Philipp Sippl <philsippl@users.noreply.github.com>",
]

[dependencies]
ark-bn254 = { version = "0.6.0", default-features = false, features = ["curve"] }
ark-ff = { version = "0.6.0", default-features = false, features = ["std"] }
ark-serialize = { version = "0.6.0", default-features = false, features = ["derive"] }
byteorder = "1"
cxx = { version = "1", optional = true }
eyre = "0.6"
hex = "0.4"
postcard = { version = "1", features = ["use-std"], default-features = false }
rand = "0.8"
ruint = { git = "https://github.com/alloy-rs/ruint", features = ["rand", "serde", "ark-ff-06", "num-bigint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = { version = "0.4.6", default-features = false }
num-traits = "0.2"

[build-dependencies]
cxx-build = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[features]
build-witness = ["dep:cxx"]
